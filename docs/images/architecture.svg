<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64768c"/></marker></defs><rect width="1600" height="1000" fill="white"/><text x="65" y="70" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#14263b" text-anchor="start">Service scheduler architecture</text><text x="65" y="115" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667c" text-anchor="start">Scenario A   |   Backend implementation   |   Trusted local evaluation</text><path d="M290 465 H350" fill="none" stroke="#64768c" stroke-width="3"  marker-end="url(#arrow)"/><text x="320" y="370" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52667c" text-anchor="middle">HTTP</text><path d="M610 425 H648 V312 H690" fill="none" stroke="#64768c" stroke-width="3"  marker-end="url(#arrow)"/><path d="M610 510 H648 V643 H690" fill="none" stroke="#64768c" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1020 312 H1075 V420 H1130" fill="none" stroke="#64768c" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1020 643 H1075 V510 H1130" fill="none" stroke="#64768c" stroke-width="3"  marker-end="url(#arrow)"/><path d="M480 550 V830 H1130" fill="none" stroke="#64768c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="780" y="808" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52667c" text-anchor="middle">Request telemetry</text><rect x="60" y="390" width="230" height="150" rx="14" fill="#f2f6fa" stroke="#205c88" stroke-width="2"/><text x="82" y="430" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#205c88" text-anchor="start">Client stub</text><text x="82" y="468" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Swagger UI</text><text x="82" y="497" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">HTTP demo script</text><rect x="350" y="380" width="260" height="170" rx="14" fill="#f2f6fa" stroke="#205c88" stroke-width="2"/><text x="372" y="420" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#205c88" text-anchor="start">Fastify API</text><text x="372" y="458" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Request validation</text><text x="372" y="487" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Request IDs</text><text x="372" y="516" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">REST + OpenAPI</text><rect x="690" y="240" width="330" height="145" rx="14" fill="#f2f6fa" stroke="#205c88" stroke-width="2"/><text x="712" y="280" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#205c88" text-anchor="start">Availability query</text><text x="712" y="318" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Find free resources</text><text x="712" y="347" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Advisory snapshot</text><rect x="690" y="550" width="330" height="185" rx="14" fill="#eaf5ee" stroke="#246745" stroke-width="2"/><text x="712" y="590" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#246745" text-anchor="start">Booking transaction</text><text x="712" y="628" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Idempotency + ownership</text><text x="712" y="657" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Skills + full interval check</text><text x="712" y="686" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Allocate and persist</text><rect x="1130" y="380" width="370" height="190" rx="14" fill="#eaf5ee" stroke="#246745" stroke-width="2"/><text x="1152" y="420" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#246745" text-anchor="start">SQLite WAL</text><text x="1152" y="458" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Reference data + appointments</text><text x="1152" y="487" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">BEGIN IMMEDIATE / COMMIT</text><text x="1152" y="516" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Foreign keys + overlap trigger</text><rect x="1130" y="740" width="370" height="140" rx="14" fill="#f2f6fa" stroke="#205c88" stroke-width="2"/><text x="1152" y="780" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#205c88" text-anchor="start">Observability</text><text x="1152" y="818" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">Structured JSON logs</text><text x="1152" y="847" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">GET /metrics</text><text x="65" y="942" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14263b" text-anchor="start">Confirmation checks availability again inside the write transaction.</text><text x="65" y="979" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52667c" text-anchor="start">The availability endpoint does not reserve capacity. No authentication is implemented in this local demo.</text></svg>