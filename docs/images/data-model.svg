, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">id, customer_id, vin</text><rect x="1170" y="180" width="300" height="100" rx="14" fill="#f2f6fa" stroke="#205c88" stroke-width="2"/><text x="1192" y="220" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#205c88" text-anchor="start">DEALERSHIP</text><text x="1192" y="258" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">id, opening hours</text><rect x="1170" y="420" width="300" height="100" rx="14" fill="#f2f6fa" stroke="#205c88" stroke-width="2"/><text x="1192" y="460" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#205c88" text-anchor="start">SERVICE BAY</text><text x="1192" y="498" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">id, dealership_id</text><rect x="1170" y="660" width="300" height="100" rx="14" fill="#f2f6fa" stroke="#205c88" stroke-width="2"/><text x="1192" y="700" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#205c88" text-anchor="start">TECHNICIAN</text><text x="1192" y="738" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">id, dealership_id, shift</text><rect x="600" y="870" width="310" height="100" rx="14" fill="#f2f6fa" stroke="#205c88" stroke-width="2"/><text x="622" y="910" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#205c88" text-anchor="start">SERVICE TYPE</text><text x="622" y="948" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">id, duration_minutes</text><rect x="1170" y="890" width="300" height="118" rx="14" fill="#f2f6fa" stroke="#205c88" stroke-width="2"/><text x="1192" y="930" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#205c88" text-anchor="start">QUALIFICATION</text><text x="1192" y="968" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">technician_id</text><text x="1192" y="997" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">service_type_id</text><rect x="530" y="320" width="440" height="400" rx="14" fill="#eaf5ee" stroke="#246745" stroke-width="2"/><text x="552" y="360" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#246745" text-anchor="start">APPOINTMENT</text><text x="552" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">id</text><text x="552" y="427" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">customer_id + vehicle_id</text><text x="552" y="456" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">dealership_id + service_type_id</text><text x="552" y="485" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">technician_id + bay_id</text><text x="552" y="514" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">starts_at + ends_at + created_at</text><text x="552" y="543" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">idempotency_key  [unique]</text><text x="552" y="572" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#223348" text-anchor="start">request_fingerprint</text><text x="65" y="1050" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14263b" text-anchor="start">Database guards</text><text x="65" y="1086" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52667c" text-anchor="start">Composite foreign keys validate ownership, dealership and qualification. Triggers reject overlap and updates.</text></svg>